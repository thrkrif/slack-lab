spring:
  application:
    name: slack-lab
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce 기본 명령 타임아웃(60초)을 그대로 두면 Redis가 끊겨도 연결이 재연결될 때까지 명령이 버퍼링돼
      # 최대 60초 응답이 없다(B1 위반 — MAJOR-2). queue.enqueue-timeout-ms(150ms, WAITAOF 서버측 타임아웃)보다
      # 넉넉하되 Slack의 3초 예산 안에 들어오게 1초로 둔다. EventWorker의 블로킹 XREADGROUP은 이 값보다 짧은
      # block(900ms)을 쓰도록 맞춰, 정상 상황에서 이 명령 타임아웃과 충돌해 조기 QueryTimeoutException이 나지
      # 않게 한다.
      timeout: 1s

# 역할: receiver | worker | reactor | recovery | all(개발 기본값). 컨테이너는 APP_ROLE로 지정한다.
app:
  role: ${APP_ROLE:all}

# 필수 값(slack.signing-secret, slack.bot-token, llm.model)은 기본값을 두지 않는다.
# 비어 있으면 기동이 실패해야 한다(A3). 값은 환경변수로 주입한다(.env.example 참조).
slack:
  signing-secret: ${SLACK_SIGNING_SECRET:}
  bot-token: ${SLACK_BOT_TOKEN:}

llm:
  client: ${LLM_CLIENT:ollama}
  base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
  model: ${LLM_MODEL:}
